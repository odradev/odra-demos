[package]
edition = "2021"
name = "airdrop"
version = "0.1.0"

[dependencies]
odra = { git = "https://github.com/odradev/odra.git", branch = "release/2.11.0", default-features = false }
odra-modules = { git = "https://github.com/odradev/odra.git", branch = "release/2.11.0", default-features = false }

[dev-dependencies]
odra-test = { git = "https://github.com/odradev/odra.git", branch = "release/2.11.0", default-features = false }
# Reads the shared test vector of the Merkle tree, ../resources/merkle_vector.json.
serde_json = "1"

[build-dependencies]
odra-build = { git = "https://github.com/odradev/odra.git", branch = "release/2.11.0", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { git = "https://github.com/odradev/odra.git", branch = "release/2.11.0", default-features = false }
odra-cli = { git = "https://github.com/odradev/odra.git", branch = "release/2.11.0", default-features = false }
# Builds Merkle trees off-chain (tests and the CLI); the contract hashes with the host's blake2b.
blake2 = "0.10"

[[bin]]
name = "airdrop_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "airdrop_build_schema"
path = "bin/build_schema.rs"
test = false

[[bin]]
name = "airdrop_cli"
path = "bin/cli.rs"
test = false

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
